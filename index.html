<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frostline Kart — Snowy Circuit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="item" class="hud panel"><canvas id="itemCanvas" width="168" height="168"></canvas><div id="itemLabel"></div></div>
<div id="lapbox" class="hud panel"><div id="lap">LAP <b>1</b>/3</div><div id="timer">0:00.00</div></div>
<div id="pos" class="hud">8<sup>th</sup></div>
<div id="speedo" class="hud"><canvas id="speedCanvas" width="260" height="150" style="width:260px;height:150px"></canvas></div>
<div id="map" class="hud panel"><canvas id="mapCanvas" width="380" height="380"></canvas></div>
<div id="toasts" class="hud"></div>
<div id="count" class="hud"></div>
<div id="wrong" class="hud">⟲ WRONG WAY</div>
<div id="hint" class="hud">ARROWS / WASD drive · SPACE item · R restart · M sound</div>
<div id="flash"></div>

<div id="results"><div class="card"><h1>FINISH!</h1><h2 id="resSub">FINAL STANDINGS</h2><table id="resTable"></table><div class="foot" id="resFoot"></div></div></div>

<div id="intro"><div class="card">
  <h1>FROST<span>LINE</span> KART</h1>
  <div class="sub">SNOWY CIRCUIT · 3 LAPS · UP TO 8 KARTS</div>

  <div id="screenStart" class="screen show">
    <div class="row"><span class="lbl">DRIVER</span><input id="nameIn" class="txt" type="text" maxlength="12" placeholder="Your name" autocomplete="off"></div>
    <div class="row" style="margin-bottom:26px"><div id="skinsStart" class="skins"></div></div>
    <div class="row">
      <button id="btnCreate" class="btn primary">CREATE ROOM</button>
      <input id="codeIn" class="txt code" type="text" maxlength="4" placeholder="CODE" autocomplete="off">
      <button id="btnJoin" class="btn">JOIN ROOM</button>
    </div>
    <div class="row"><button id="btnSolo" class="btn small">PLAY SOLO VS CPU</button></div>
    <div id="status"></div>
    <p class="help"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> drive · <kbd>SPACE</kbd> item · hold throttle on <b>GO</b> for a rocket start</p>
  </div>

  <div id="screenLobby" class="screen">
    <div class="lbl">ROOM CODE</div>
    <h2 id="roomCode">----</h2>
    <div id="roomAddr"></div>
    <div class="row"><div id="skinsLobby" class="skins"></div></div>
    <ul id="players" class="players"></ul>
    <div class="row" id="hostRow">
      <label class="chk"><input id="chkFill" type="checkbox" checked> FILL EMPTY SLOTS WITH CPU</label>
    </div>
    <div class="row">
      <button id="btnReady" class="btn good">READY</button>
      <button id="btnStart" class="btn primary">START RACE</button>
      <button id="btnLeave" class="btn small">LEAVE</button>
    </div>
    <div id="lobbyStatus" class="help"></div>
  </div>
</div></div>

<script type="importmap">{ "imports": { "three": "/lib/three.module.js" } }</script>
<script type="module" src="/app.js"></script>
</body>
</html>
