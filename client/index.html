<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no: Safari ignores it in a tab but honours it from the home screen, where it stops a two-thumb pinch from cancelling the game's touches -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LAN Party</title>
<!-- home-screen install: iOS reads the apple-* tags, Android the manifest; either way the game then runs without the browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LAN Party">
<meta name="theme-color" content="#0a0e24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- the chosen game mounts its canvas and HUD in here -->
<div id="stage" hidden></div>

<div id="intro"><div class="card">
  <h1>LAN <span>PARTY</span></h1>
  <div class="sub" id="subtitle">PICK A GAME · CREATE A ROOM · FRIENDS JOIN WITH THE CODE</div>

  <div id="screenStart" class="screen show">
    <div class="row"><span class="lbl">PLAYER</span><input id="nameIn" class="txt" type="text" maxlength="12" placeholder="Your name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"></div>
    <div class="row" style="margin-bottom:26px"><div id="avatarsStart" class="avatars"></div></div>
    <div class="lbl">GAME</div>
    <div id="gameList" class="games"></div>
    <div id="soloOptsWrap" hidden><div class="lbl">SOLO OPTIONS</div><div id="soloOpts" class="opts"></div></div>
    <div class="row">
      <button id="btnCreate" class="btn primary">CREATE ROOM</button>
      <input id="codeIn" class="txt code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
      <button id="btnJoin" class="btn">JOIN ROOM</button>
    </div>
    <div class="row"><button id="btnSolo" class="btn small">PLAY SOLO</button></div>
    <div id="status"></div>
  </div>

  <div id="screenLobby" class="screen">
    <div class="lbl">ROOM CODE</div>
    <h2 id="roomCode">----</h2>
    <div id="roomAddr"></div>
    <div id="roomQr" class="qr" hidden><canvas width="1" height="1"></canvas><span>SCAN WITH A PHONE TO JOIN</span></div>
    <div id="lobbyGame" class="gametag"></div>
    <div class="row"><div id="avatarsLobby" class="avatars"></div></div>
    <div id="teams" class="teams" hidden></div>
    <ul id="players" class="players"></ul>
    <div id="teamBtns" class="row" hidden>
      <button id="btnFriend" class="btn small">JOIN HOST'S TEAM</button>
      <button id="btnEnemy" class="btn small">JOIN OTHER TEAM</button>
    </div>
    <div id="opts" class="opts"></div>
    <div class="row">
      <button id="btnReady" class="btn good">READY</button>
      <button id="btnStart" class="btn primary">START GAME</button>
      <button id="btnLeave" class="btn small">LEAVE</button>
    </div>
    <div id="lobbyStatus" class="help"></div>
  </div>
</div></div>

<script type="importmap">{ "imports": { "three": "/lib/three.module.js", "cannon-es": "/lib/cannon-es.js" } }</script>
<script type="module" src="/app.js"></script>
</body>
</html>
